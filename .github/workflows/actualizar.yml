name: Actualizar estadísticas NBA
on:
  schedule:
    - cron: '15 12 * * *' # 06:15 hora de Yucatán (UTC-6)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar datos
        run: python actualizar.py
      - name: Guardar datos nuevos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar estadísticas NBA'
            git push
          fi
